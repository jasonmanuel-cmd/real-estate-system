name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies from the root lockfile
        run: npm ci
      - name: Generate the database client without touching a database
        run: npm run db:generate --workspace=backend
      - name: Check both workspaces
        run: npm run typecheck --workspaces
      - name: Test dashboard authentication
        run: npm test
      - name: Build both workspaces
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
